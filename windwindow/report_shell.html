<title>WindWindow Sim</title>
<style>
  /* Deliberately plain. Left column, default fonts, hairline tables, images
     that fit. No cards, no shadows, no theme switching. */
  body {
    max-width: 52em;
    margin: 2em auto;
    padding: 0 1em;
    background: #fff;
    color: #000;
    line-height: 1.5;
  }
  h1 { font-size: 1.8em; margin: 0 0 0.3em; }
  h2 { font-size: 1.3em; margin: 2em 0 0.4em; }
  h3 { font-size: 1.05em; margin: 1.4em 0 0.3em; }
  p { margin: 0 0 0.9em; }
  ul { margin: 0 0 0.9em; padding-left: 1.4em; }
  li { margin-bottom: 0.4em; }
  a { color: #00c; }
  img { max-width: 100%; height: auto; border: 1px solid #ccc; }
  figure { margin: 1.2em 0; }
  figcaption { font-size: 0.85em; color: #444; margin-top: 0.4em; }
  table { border-collapse: collapse; margin: 0.8em 0; font-size: 0.9em; }
  th, td { border: 1px solid #999; padding: 0.25em 0.6em; text-align: left; }
  th { background: #eee; }
  td.n, th.n { text-align: right; }
  caption { caption-side: bottom; text-align: left; font-size: 0.85em;
            color: #444; padding-top: 0.4em; }
  pre { background: #f4f4f4; border: 1px solid #ccc; padding: 0.6em;
        overflow-x: auto; font-size: 0.85em; }
  code { background: #f4f4f4; padding: 0 0.2em; }
  blockquote { margin: 0.9em 0; padding: 0 0 0 0.9em; border-left: 3px solid #999; }
  .tw { overflow-x: auto; }
  .toc { font-size: 0.9em; }
  .sub { color: #444; }
  hr { border: 0; border-top: 1px solid #ccc; margin: 2em 0; }
</style>
